<!DOCTYPE html>
<html>
<head>
    <title>Answer Questions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .question {
            margin-bottom: 20px;
        }

        .question label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .question input[type="text"],
        .question textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #222c70;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #1a1f5d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Answer Questions</h1>
        <form method="POST" action="/submit_answers">
            {% for question in questions %}
            <div class="question">
                <label>{{ question.question_text }}</label>
                {% if question.question_type == 'openEnded' %}
                <textarea name="answer_{{ question.id }}" rows="3" placeholder="Enter your answer here"></textarea>
                {% elif question.question_type == 'multipleChoice' or question.question_type == 'checkbox' %}
                {% for option in question.options.split(',') %}
                <div>
                    <input type="{{ 'radio' if question.question_type == 'multipleChoice' else 'checkbox' }}" name="answer_{{ question.id }}" value="{{ option }}">
                    <label>{{ option }}</label>
                </div>
                {% endfor %}
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn">Submit Answers</button>
        </form>
    </div>
</body>
</html>
